name: Build Ruiyou Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Explain backend availability
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning::Supabase not configured. This APK is an installation preview. Login, chat and video require Supabase setup and rebuilding."
          fi
      - name: Install packages and run checks
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Generate Android project and install Ruiyou icon
        run: npm run android:init
      - name: Build Android debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Stage APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ruiyou-preview.apk
          sha256sum ruiyou-preview.apk > ruiyou-preview.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ruiyou-android-apk
          path: |
            ruiyou-preview.apk
            ruiyou-preview.apk.sha256
          if-no-files-found: error
      - name: Publish prerelease download for testers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0-preview >/dev/null 2>&1; then
            gh release upload v0.1.0-preview ruiyou-preview.apk ruiyou-preview.apk.sha256 --clobber
          else
            gh release create v0.1.0-preview ruiyou-preview.apk ruiyou-preview.apk.sha256 \
              --title '瑞友 RUIYOU Android 预览安装包' --prerelease \
              --notes '内测预览版，仅供安装测试。未配置 Supabase 时只能显示联网配置提示；云端聊天、视频通话需要配置 Supabase、数据库和 TURN 后重新构建，尚未通过双机测试。Debug APK 不适合正式商店发布。'
          fi
