name: Prepare signed Google Play AAB
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode (increase for every Play upload)"
        required: true
        default: "1"
        type: string
      version_name:
        description: "Version shown to users"
        required: true
        default: "1.0.0"
        type: string

# Manual only. Never publish an unconfigured app, an upload keystore, or an unsigned bundle.
permissions:
  contents: read

jobs:
  signed-bundle:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ruiyou-upload-key.jks
      RUIYOU_VERSION_CODE: ${{ inputs.version_code }}
      RUIYOU_VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Check required configuration
        shell: bash
        run: |
          set -euo pipefail
          for required in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!required:-}" ]; then echo "::error title=Missing configuration::Missing repository Actions secret: $required"; exit 1; fi
          done
          [[ "$VITE_SUPABASE_URL" =~ ^https://[a-zA-Z0-9-]+\.supabase\.co$ ]] || { echo "::error::Invalid Supabase Project URL"; exit 1; }
          [[ "$RUIYOU_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "::error::version_code must be a positive integer"; exit 1; }
          [[ "$RUIYOU_VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "::error::version_name must use numbers and dots"; exit 1; }
      - name: Install JS dependencies and run checks
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Generate Android project
        run: npm run android:init
      - name: Configure Android release signing and API 36
        run: node scripts/android-production.mjs
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          fi
      - name: Restore private upload keystore
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
      - name: Build signed Android App Bundle
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
      - name: Verify and stage AAB
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$BUNDLE"
          jarsigner -verify "$BUNDLE" >/dev/null
          cp "$BUNDLE" ruiyou-google-play-upload.aab
          sha256sum ruiyou-google-play-upload.aab > ruiyou-google-play-upload.aab.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ruiyou-signed-play-bundle
          path: |
            ruiyou-google-play-upload.aab
            ruiyou-google-play-upload.aab.sha256
          if-no-files-found: error
          retention-days: 14
